<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>libsignal-protocol PWA Example</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                margin: 2rem;
                color: #222;
            }
            textarea {
                width: 100%;
                min-height: 6rem;
                font-family: monospace;
            }
            button {
                margin-top: 0.5rem;
                padding: 0.5rem 1rem;
            }
            #log {
                margin-top: 2rem;
                padding: 1rem;
                background: #f5f5f5;
                border-radius: 0.5rem;
                max-height: 12rem;
                overflow-y: auto;
                font-family: monospace;
            }
        </style>
    </head>
    <body>
        <h1>Signal Protocol PWA Demo</h1>
        <p>Status: <span id="status">initialising…</span></p>
        <textarea id="message" placeholder="Type a message to encrypt"></textarea>
        <button id="send">Encrypt &amp; Queue</button>
        <div id="log"></div>
        <script type="module" src="./app.ts"></script>
    </body>
</html>
