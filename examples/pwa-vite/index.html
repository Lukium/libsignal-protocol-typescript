<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>libsignal-protocol-typescript • Vite PWA Demo</title>
        <style>
            :root {
                font-family:
                    Inter,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    sans-serif;
                background: #0f1729;
                color: #e2e8f0;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
            }

            main {
                max-width: 640px;
                width: 100%;
                padding: 2rem;
                box-sizing: border-box;
                display: grid;
                gap: 1rem;
                background: rgba(15, 23, 42, 0.75);
                border: 1px solid rgba(148, 163, 184, 0.2);
                border-radius: 12px;
            }

            button {
                background: #38bdf8;
                color: #0f1729;
                border: none;
                border-radius: 8px;
                padding: 0.75rem 1rem;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
            }

            button:disabled {
                opacity: 0.45;
                cursor: not-allowed;
            }

            pre {
                margin: 0;
                padding: 1rem;
                background: rgba(15, 23, 42, 0.5);
                border-radius: 8px;
                max-height: 260px;
                overflow: auto;
                border: 1px solid rgba(148, 163, 184, 0.2);
                font-size: 0.85rem;
            }
        </style>
    </head>
    <body>
        <main>
            <section>
                <h1>libsignal-protocol-typescript × Vite PWA</h1>
                <p>
                    This demo spins up a Service Worker, negotiates a Signal session using the IndexedDB adapter, and
                    exchanges encrypted messages entirely client-side.
                </p>
            </section>
            <section>
                <button id="send" disabled>Send Encrypted Message</button>
            </section>
            <section>
                <h2>Event Log</h2>
                <pre id="log">Booting…</pre>
            </section>
        </main>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
