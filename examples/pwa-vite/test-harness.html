<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Protocol Test Harness</title>
</head>
<body>
    <h1>Signal Protocol Test Harness</h1>
    <p id="status">Loading...</p>

    <script type="module">
        try {
            const { KeyHelper } = await import('@lukium/libsignal-protocol-typescript/key-helper');
            const { SessionBuilder } = await import('@lukium/libsignal-protocol-typescript/session-builder');
            const { SessionCipher } = await import('@lukium/libsignal-protocol-typescript/session-cipher');
            const { SignalProtocolAddress } = await import('@lukium/libsignal-protocol-typescript/signal-protocol-address');

            // Expose library on window for Playwright tests
            window.SignalProtocol = {
                KeyHelper,
                SessionBuilder,
                SessionCipher,
                SignalProtocolAddress,
            };

            document.getElementById('status').textContent = 'Library loaded successfully';
        } catch (error) {
            document.getElementById('status').textContent = 'Error: ' + error.message;
            console.error('Library load error:', error);
        }
    </script>
</body>
</html>
